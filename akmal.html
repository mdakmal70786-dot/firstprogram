<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pro Landing Page</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Particle Background */
    body::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, #00ffcc 1px, transparent 1px);
      background-size: 40px 40px;
      animation: move 10s linear infinite;
      opacity: 0.2;
    }

    @keyframes move {
      from { transform: translate(0, 0); }
      to { transform: translate(-200px, -200px); }
    }

    .container {
      text-align: center;
      z-index: 1;
      color: white;
    }

    h1 {
      font-size: 50px;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #00ffcc;
    }

    /* Button Style */
    .btn {
      padding: 15px 35px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      background: #00ffcc;
      color: black;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px #00ffcc;
    }

    .btn:hover {
      background: white;
      transform: scale(1.1);
      box-shadow: 0 0 25px white;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Md Akmal 🚀</h1>
    <p>Future Web Developer</p>
    <button class="btn">Click Me</button>
  </div>

</body>
</html>
